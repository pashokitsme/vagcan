[package]
name = "vag-data"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
miniz_oxide = "0.7"

[dev-dependencies]
criterion = { workspace = true }

[features]
# The `.rod` product/IV offline recovery (`rod::crack`) is always compiled; this
# feature flag is retained as a no-op so callers can request it explicitly
# (e.g. `cargo run --features rod-crack --bin vag-rod`).
rod-crack = []

[[bin]]
name = "vag-labels"
path = "src/bin/vag-labels.rs"

[[bin]]
name = "vag-rod"
path = "src/bin/vag-rod.rs"

[[bench]]
name = "lookup"
harness = false
