[package]
name = "vag-data"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
miniz_oxide = "0.7"

[dev-dependencies]
criterion = { workspace = true }

[features]
# The `.rod` IV brute force. Off by default: it is minutes of CPU per section,
# and every consumer of the *result* reads the cached five bytes instead. Only
# `vagcan vcds rod` turns it on, through `vagcan`'s feature of the same name.
rod-crack = []

[[bench]]
name = "lookup"
harness = false
