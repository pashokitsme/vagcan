[package]
name = "vag-protocol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Reading the per-car unit-number table; see address.rs — host only.
serde_json = { workspace = true, optional = true }
vag-transport = { path = "../vag-transport", default-features = false }
# `read.rs` is the ONLY reason this crate touches vag-data, and `read.rs` is
# host-only: the board executes a plan with the scaling already baked in and
# could not hold an 88 MB catalog in 400 KB of SRAM if it wanted to.
vag-data = { path = "../vag-data", optional = true }
thiserror.workspace = true

[dev-dependencies]
vag-capture = { path = "../vag-capture" }
vag-transport = { path = "../vag-transport", features = ["serde", "test-util"] }
tokio = { workspace = true, features = ["rt", "macros"] }

[features]
default = ["std"]
# The host build. With `--no-default-features` the crate is `no_std` + `alloc`
# and loses exactly two modules:
#
#   address.rs  reads the filesystem (the per-car unit-number override table),
#   read.rs     decodes a measurement against a `vag-data` catalog,
#
# which is also what drops the `vag-data` edge. Everything the board needs —
# the UDS client, the PDU allowlist, DTC parsing, the gateway installation
# list, identity reads, software ISO-TP — stays.
std = ["dep:serde_json", "dep:vag-data", "thiserror/std", "vag-transport/std"]
