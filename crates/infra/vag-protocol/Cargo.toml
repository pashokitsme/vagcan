[package]
name = "vag-protocol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Reading the per-car unit-number table; see address.rs.
serde_json.workspace = true
vag-transport = { path = "../vag-transport" }
vag-data = { path = "../../infra/vag-data" }
