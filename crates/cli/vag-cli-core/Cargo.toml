[package]
name = "vag-cli-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# What both command crates stand on: which car this is, what channels it has,
# how to poll them, where the files live, and the terminal widgets. It knows
# nothing about any particular command — `diag` and `measure` are its callers,
# not its subject.

[features]
# The scripted-answer harness for the menu, and anything else a *another*
# crate's tests need. `#[cfg(test)]` reaches only this crate's own tests, and
# `diag`'s setup tests drive this menu.
test-util = []
# A test build's `~/.vagcan` is a temporary directory, never HOME's (`datadir::vagcan_dir`).
# Turned on by every crate's dev-dependency on this one: opening a cache can upgrade it, and
# a test that reached the person's own was writing their data. Never a normal dependency.
test-root = []

[dependencies]
vag-uds-client = { path = "../../uds/vag-uds-client" }
vag-uds-transport = { path = "../../uds/vag-uds-transport" }
vag-uds-can = { path = "../../uds/vag-uds-can", features = ["slcan"] }
vag-uds-capture = { path = "../../uds/vag-uds-capture" }
vag-data-labels = { path = "../../data/vag-data-labels" }
vag-data-db = { path = "../../data/vag-data-db" }
# `device.rs` finds the dash board over BLE and opens its UART as the bus's pipe.
vag-dash-ble = { path = "../../dash/vag-dash-ble" }
# The plan generator (`dash.rs`) writes the firmware's `vag_dash_render::plan`; its tests
# assert on the board's own decoder, so the plan has one definition, not a copy here.
vag-dash-render = { path = "../../dash/vag-dash-render" }
# `device::DeviceArg`: `--device` and `--ble`, declared once for every command that
# takes them, in `vagcan` and in `vagcan-measure` alike.
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
ratatui = "0.29"
crossterm = "0.28"
dirs = "6"
# The bus scheduler's shell (`bus.rs`): one task owns the link, handles talk to
# it over channels, and it keeps time with tokio's clock.
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
# `link::pipe_pair`: the remote bus's tests talk to a scripted board through it.
vag-uds-transport = { path = "../../uds/vag-uds-transport", features = ["test-util"] }
# `dash.rs`: a cache whose levels lost their upper ends, made with SQL.
# The version `vag-data-db` locks, so nothing new is fetched.
rusqlite = { version = "0.31", features = ["bundled"] }
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
