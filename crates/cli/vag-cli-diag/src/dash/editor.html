<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dash pages</title>
<style>
/* `vagcan dev dash edit`: the panel big in the middle, the pages as a strip above it, the car's
   channels in a column to the right. Everything here comes from this page's own server. */
:root {
  --bg: #0a0e13;
  --panel: #111821;
  --raise: #17212d;
  --line: #243243;
  --fg: #dbe5ef;
  --muted: #7f92a6;
  --oled: #62d3ff;
  --oled-dim: #0d2633;
  --accent: #ffb547;
  --ok: #6fd08c;
  --warn: #d9b25c;
  --bad: #e5806e;
  --display: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --body: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.4; padding: 20px 16px 48px; }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: .06em; margin: 0; color: var(--oled); }
.sub { color: var(--muted); font-size: 14px; }
.status { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
@media (max-width: 980px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

.strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.thumb { flex: 0 0 auto; display: grid; gap: 4px; padding: 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--raise); cursor: pointer; color: var(--fg); font: inherit; text-align: left; }
.thumb canvas { width: 168px; height: 42px; image-rendering: pixelated; display: block; border-radius: 2px; }
.thumb .tname { font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.thumb[aria-current="true"] { border-color: var(--oled); box-shadow: 0 0 0 1px var(--oled) inset; }
.thumb[aria-current="true"] .tname { color: var(--oled); }
.thumb.drop-before { box-shadow: -3px 0 0 var(--accent); }
.addpage { flex: 0 0 auto; width: 90px; border: 1px dashed var(--line); border-radius: 5px; background: none; color: var(--muted); font: inherit; cursor: pointer; }
.addpage:hover:not(:disabled) { color: var(--oled); border-color: var(--oled); }
.addpage:disabled { opacity: .4; cursor: default; }

.settings { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.field { display: flex; align-items: center; gap: 8px; }
input[type=text], input[type=number], input[type=search] {
  background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: 14px var(--mono); min-width: 0;
}
input[type=text] { width: 200px; text-transform: uppercase; }
input[type=number] { width: 84px; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { background: none; border: 0; color: var(--muted); padding: 6px 12px; font: 600 14px var(--body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--oled-dim); color: var(--oled); }
.tog { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
.tog input { accent-color: var(--oled); width: 16px; height: 16px; }
.tog.off { opacity: .45; cursor: default; }
.hint { font-size: 13px; color: var(--muted); }
.hint.warn { color: var(--warn); }
.btn { background: var(--raise); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; font: 600 14px var(--body); cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
.btn.primary { background: var(--oled-dim); color: var(--oled); border-color: #1d4c63; }
.spacer { flex: 1; }

.bezel { background: #000; border-radius: 10px; padding: 14px; border: 1px solid #1a222c; }
.screen { position: relative; width: 100%; max-width: 1024px; margin: 0 auto; aspect-ratio: 4 / 1; }
.screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.zones { position: absolute; inset: 0; }
.zone { position: absolute; border: 1px dashed transparent; border-radius: 3px; cursor: grab; }
.zone:hover, body.dragging .zone { border-color: rgba(98, 211, 255, .35); }
.zone.sel { border-color: var(--accent); border-style: solid; }
.zone.over { background: rgba(255, 181, 71, .12); border-color: var(--accent); }
.zone .x { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 3px; border: 0; background: rgba(229, 128, 110, .9); color: #160805; font: 700 14px var(--mono); line-height: 22px; cursor: pointer; display: none; padding: 0; }
.zone:hover .x, .zone.sel .x { display: block; }
.zone.empty { border-color: rgba(98, 211, 255, .35); display: grid; place-items: center; color: var(--muted); font-size: 14px; cursor: default; text-align: center; }
.addcol { flex: 1; border: 1px dashed var(--line); border-radius: 5px; padding: 10px; text-align: center; color: var(--muted); font-size: 14px; }
.addcol.over { border-color: var(--accent); color: var(--accent); background: rgba(255, 181, 71, .08); }
.under { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }

.catalog { position: sticky; top: 12px; max-height: calc(100vh - 40px); grid-template-rows: auto auto minmax(0, 1fr); }
@media (max-width: 980px) { .catalog { position: static; max-height: none; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 3px 10px; font: 13px var(--body); cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--oled); border-color: var(--oled); }
.cards { display: grid; gap: 6px; overflow-y: auto; min-height: 0; padding-right: 2px; align-content: start; }
.card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; background: var(--raise); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; cursor: grab; text-align: left; color: var(--fg); font: inherit; width: 100%; }
.card:hover { border-color: var(--oled); }
.card.used { opacity: .5; }
.card .lab { font-family: var(--display); font-size: 16px; color: var(--oled); letter-spacing: .03em; }
.card .unit { font-family: var(--mono); font-size: 12px; color: var(--muted); align-self: center; }
.card .name { grid-column: 1 / -1; font-size: 13px; color: var(--fg); }
.card .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.pill { border-radius: 3px; padding: 0 5px; font-family: var(--body); font-size: 11px; border: 1px solid currentColor; }
.pill.proven { color: var(--ok); } .pill.mute { color: var(--muted); }
.more { font-size: 13px; color: var(--muted); padding: 6px 2px; }
input#label-input { width: 150px; }

.export pre { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 12px; font: 13px/1.5 var(--mono); color: var(--fg); overflow-x: auto; max-height: 420px; }
.export .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
code { font-family: var(--mono); font-size: .92em; color: var(--oled); }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--raise); border: 1px solid var(--accent); color: var(--fg); padding: 8px 14px; border-radius: 5px; font-size: 14px; max-width: calc(100vw - 32px); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DASH PAGES</h1>
    <span class="sub">Drag a channel onto the panel, or click its card. Click a cell to change its label. The panel is drawn by the dash's own renderer; a cell shows dashes, as the board does before a channel answers.</span>
    <span class="status" id="status">loading…</span>
  </header>

  <div class="grid">
    <section class="box" aria-label="Pages">
      <div class="label">Pages <span id="pagecount"></span></div>
      <div class="strip" id="strip"></div>

      <div class="settings">
        <label class="field"><span class="label">Title</span><input type="text" id="title-input" maxlength="34" placeholder="no title" autocomplete="off"></label>
        <div class="seg" role="group" aria-label="Kind of page">
          <button type="button" id="kind-values" aria-pressed="true">Values</button>
          <button type="button" id="kind-chart" aria-pressed="false">Chart</button>
        </div>
        <label class="tog" id="volts-label"><input type="checkbox" id="volts-toggle"> Voltage in the strip</label>
        <span class="spacer"></span>
        <button type="button" class="btn" id="move-left" aria-label="Move the page left">←</button>
        <button type="button" class="btn" id="move-right" aria-label="Move the page right">→</button>
        <button type="button" class="btn danger" id="delete-page">Delete page</button>
      </div>

      <div class="bezel">
        <div class="screen" id="screen">
          <canvas id="panel" width="1024" height="256" aria-label="The panel, 256 by 64"></canvas>
          <div class="zones" id="zones"></div>
        </div>
      </div>

      <div class="under" id="under"></div>
      <div class="hint" id="notes"></div>
    </section>

    <aside class="box catalog" aria-label="Channels">
      <div class="label">Channels · <span id="catcount"></span></div>
      <div style="display:grid;gap:8px">
        <input type="search" id="search" placeholder="search: name, id, identifier, unit of measure…" autocomplete="off">
        <div class="chips" id="blocks"></div>
        <div class="chips">
          <label class="tog"><input type="checkbox" id="only-numeric" checked> numbers only</label>
        </div>
      </div>
      <div class="cards" id="cards"></div>
    </aside>
  </div>

  <section class="box export" aria-label="dash.toml">
    <div class="row">
      <div class="label">For dash.toml</div>
      <span class="spacer"></span>
      <button type="button" class="btn primary" id="copy">Copy</button>
    </div>
    <pre id="toml"></pre>
    <div class="hint" id="export-hint"></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// ---- what the server wrote for this car: channels.json (every channel its dash build accepts
// or refuses, `vagcan dev dash edit`'s catalog) and layout.json (its dash.toml's pages).
let CAT = [], byRef = new Map(), LAYOUT = null;
let MAX_PAGES = 8, MAX_CELLS = 4;
const SHOWN_CARDS = 150, LABEL_FITS = 10;

let state = { pages: [], labels: {}, decimals: {} };
let sel = 0, selCol = -1, block = "all";
const $ = id => document.getElementById(id);
function page() { return state.pages[sel]; }
function onPageRefs(p) { return p.kind === "chart" ? (p.cell ? [p.cell] : []) : p.cells; }
function chan(ref) { return byRef.get(ref) || { ref, unit: ref.split(":")[0], unitName: "", name: "not among this car's channels", label: null, uom: "", numeric: true, decimals: 0, missing: true }; }
function same(a, b) { return !!a && !!b && chan(a).ref === chan(b).ref; }
// What the panel shows: the label written for it, else the build's own.
function labelOf(ref) { const c = chan(ref); return state.labels[c.ref] || c.label || c.name; }
function decOf(ref) { const c = chan(ref), d = state.decimals[c.ref] ?? c.decimals; return Number.isInteger(d) ? Math.min(d, 3) : 1; }

// ---- the panel: the dash's own renderer, compiled to WebAssembly (dash.wasm)
const W = 256, H = 64, ICON = 10, CW = W - ICON;
let wasm = null;
async function loadWasm() {
  try {
    const r = await fetch("dash.wasm");
    const { instance } = await WebAssembly.instantiate(await r.arrayBuffer(), {});
    wasm = instance.exports;
  } catch (e) {
    wasm = null;
    toast("The renderer did not load: " + (e?.message || e));
  }
}

// What the strip shows on a page: its title, and the voltage unless the page has it as a cell.
function stripOf(p) {
  const refs = onPageRefs(p), volts = LAYOUT?.strip || null;
  const voltsDup = !!volts && p.volts && refs.some(r => same(r, volts));
  const shown = !!volts && p.volts && !voltsDup;
  const title = (p.title || "").trim().toUpperCase();
  return { volts: shown, title, voltsDup, shown: !!(title || shown) };
}
function cellIn(ref) {
  return { label: labelOf(ref), value: null, unit: chan(ref).uom || "", decimals: decOf(ref), deviation: null };
}
function pageIn(p) {
  const st = stripOf(p);
  const out = { cells: [], chart: null, strip: st.shown ? { voltsShown: st.volts, volts: null, title: st.title } : null };
  if (p.kind === "values") out.cells = p.cells.map(cellIn);
  else if (p.cell) out.chart = { cell: cellIn(p.cell), min: p.min, max: p.max, samples: [], seconds_per_sample: 0.5 };
  return out;
}
const enc = new TextEncoder();
function bitsOf(p) {
  const bits = new Uint8Array(W * H);
  if (!wasm) return bits;
  const json = enc.encode(JSON.stringify(pageIn(p)));
  const ptr = wasm.input(json.length);
  new Uint8Array(wasm.memory.buffer, ptr, json.length).set(json);
  if (wasm.render() !== 0) return bits;
  const raw = new Uint8Array(wasm.memory.buffer, wasm.output(), W * H / 8);
  for (let i = 0; i < W * H; i++) bits[i] = (raw[i >> 3] >> (7 - (i & 7))) & 1;
  return bits;
}
function paint(canvas, bits, gap) {
  const c = canvas.getContext("2d"), s = canvas.width / W;
  c.fillStyle = "#02060a"; c.fillRect(0, 0, canvas.width, canvas.height);
  c.fillStyle = "#62d3ff";
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (bits[y * W + x]) c.fillRect(x * s, y * s, s - gap, s - gap);
}

// ---- the editor
function blank() { return { title: "", kind: "values", cells: [], cell: "", min: 0, max: 100, volts: true }; }
function render() {
  if (!state.pages.length) state.pages.push(blank());
  sel = Math.min(sel, state.pages.length - 1);
  const p = page();
  if (p.kind !== "values" || selCol >= p.cells.length) selCol = -1;
  renderStrip(); renderSettings(); renderPanel(); renderCards(); renderToml();
}

function renderStrip() {
  const el = $("strip"); el.textContent = "";
  $("pagecount").textContent = `· ${state.pages.length} of ${MAX_PAGES}`;
  state.pages.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "thumb"; b.draggable = true;
    b.setAttribute("aria-current", i === sel ? "true" : "false");
    const cv = document.createElement("canvas"); cv.width = 512; cv.height = 128;
    paint(cv, bitsOf(p), 0);
    const name = document.createElement("span"); name.className = "tname";
    const t = (p.title || "").trim().toUpperCase();
    const a = document.createElement("span"); a.textContent = `${i + 1}. ${t || "no title"}`;
    const k = document.createElement("span"); k.textContent = p.kind === "chart" ? "chart" : `${p.cells.length} cells`;
    name.append(a, k); b.append(cv, name);
    b.addEventListener("click", () => { sel = i; selCol = -1; render(); });
    b.addEventListener("dragstart", e => startDrag(e, { from: "page", i }));
    b.addEventListener("dragend", endDrag);
    b.addEventListener("dragover", e => { if (drag?.from === "page") { e.preventDefault(); b.classList.add("drop-before"); } });
    b.addEventListener("dragleave", () => b.classList.remove("drop-before"));
    b.addEventListener("drop", e => {
      b.classList.remove("drop-before");
      const d = drag; endDrag();
      if (d?.from !== "page" || d.i === i) return;
      e.preventDefault();
      const [moved] = state.pages.splice(d.i, 1);
      state.pages.splice(i, 0, moved); sel = i; changed();
    });
    el.append(b);
  });
  const add = document.createElement("button");
  add.type = "button"; add.className = "addpage"; add.textContent = "+ page";
  add.disabled = state.pages.length >= MAX_PAGES;
  add.addEventListener("click", () => { state.pages.push(blank()); sel = state.pages.length - 1; selCol = -1; changed(); });
  el.append(add);
}

function renderSettings() {
  const p = page(), ti = $("title-input");
  if (document.activeElement !== ti) ti.value = p.title || "";
  $("kind-values").setAttribute("aria-pressed", p.kind === "values");
  $("kind-chart").setAttribute("aria-pressed", p.kind === "chart");
  const strip = !!LAYOUT?.strip;
  $("volts-toggle").checked = strip && !!p.volts;
  $("volts-toggle").disabled = !strip;
  $("volts-label").className = "tog" + (strip ? "" : " off");
  $("volts-label").title = strip ? `${labelOf(LAYOUT.strip)} (${LAYOUT.strip}), from [strip] volts` : "dash.toml has no [strip] volts";
  $("move-left").disabled = sel === 0;
  $("move-right").disabled = sel === state.pages.length - 1;
  $("delete-page").disabled = state.pages.length <= 1;
}

function renderPanel() {
  const p = page();
  paint($("panel"), bitsOf(p), 0.8);
  const st = stripOf(p), T = st.shown ? 9 : 0, n = p.kind === "values" ? p.cells.length : 1;
  const z = $("zones"); z.textContent = "";
  const top = (T / H * 100) + "%", hgt = ((H - T) / H * 100) + "%", full = (CW / W * 100) + "%";
  if (p.kind === "values") {
    if (!n) {
      const e = zoneEl({ left: "0", width: full, top, height: hgt });
      e.classList.add("empty"); e.textContent = "Drop a channel here";
      dropTarget(e, d => addCell(d.ref));
      z.append(e);
    }
    const colW = CW / Math.max(n, 1);
    p.cells.forEach((ref, i) => {
      const e = zoneEl({ left: (colW * i / W * 100) + "%", width: (colW / W * 100) + "%", top, height: hgt });
      e.draggable = true; e.title = chan(ref).name + " — click to change its label; drag to swap";
      if (i === selCol) e.classList.add("sel");
      e.addEventListener("click", ev => { if (ev.target.closest(".x")) return; selCol = selCol === i ? -1 : i; renderPanel(); if (selCol >= 0) $("label-input")?.focus(); });
      e.addEventListener("dragstart", ev => startDrag(ev, { from: "col", i }));
      e.addEventListener("dragend", endDrag);
      dropTarget(e, d => {
        if (d.from === "col") { if (d.i !== i) [p.cells[d.i], p.cells[i]] = [p.cells[i], p.cells[d.i]]; }
        else placeCell(d.ref, i);
        changed();
      }, ["cat", "col"]);
      const x = document.createElement("button");
      x.type = "button"; x.className = "x"; x.textContent = "×"; x.setAttribute("aria-label", "Remove the cell");
      x.addEventListener("click", () => { p.cells.splice(i, 1); selCol = -1; changed(); });
      e.append(x); z.append(e);
    });
  } else {
    const e = zoneEl({ left: "0", width: full, top, height: hgt });
    if (!p.cell) { e.classList.add("empty"); e.textContent = "Drop a channel here to chart it"; }
    else e.title = chan(p.cell).name + " — drop another channel to replace it";
    dropTarget(e, d => setChart(d.ref));
    z.append(e);
  }
  renderUnder(st);
}
function zoneEl(pos) { const e = document.createElement("div"); e.className = "zone"; Object.assign(e.style, pos); return e; }

function labelField(ref) {
  const c = chan(ref);
  const l = document.createElement("label"); l.className = "field";
  const s = document.createElement("span"); s.className = "label"; s.textContent = "Label";
  const i = document.createElement("input"); i.type = "text"; i.id = "label-input"; i.maxLength = 16; i.autocomplete = "off";
  i.value = labelOf(ref);
  const h = document.createElement("span"); h.className = "hint";
  const hint = () => {
    const len = [...i.value].length;
    h.textContent = `${c.name} · ${c.ref}` + (len > LABEL_FITS ? ` · ${len} characters: ${LABEL_FITS} fit on a page of four cells` : "");
    h.className = "hint" + (len > LABEL_FITS ? " warn" : "");
  };
  hint();
  i.addEventListener("input", () => {
    const v = i.value.toUpperCase().trim();
    if (v) state.labels[c.ref] = v; else delete state.labels[c.ref];
    hint(); changed(true);
  });
  l.append(s, i);
  return [l, h];
}

function renderUnder(st) {
  const p = page(), u = $("under"); u.textContent = "";
  if (p.kind === "values") {
    if (selCol >= 0) u.append(...labelField(p.cells[selCol]));
    else if (p.cells.length && p.cells.length < MAX_CELLS) {
      const a = document.createElement("div");
      a.className = "addcol"; a.textContent = `+ cell: drop a channel here (${MAX_CELLS - p.cells.length} more fit)`;
      dropTarget(a, d => addCell(d.ref));
      u.append(a);
    }
  } else {
    for (const [k, name] of [["min", "Scale from"], ["max", "to"]]) {
      const l = document.createElement("label"); l.className = "field";
      const s = document.createElement("span"); s.className = "label"; s.textContent = name;
      const i = document.createElement("input"); i.type = "number"; i.step = "any"; i.id = "chart-" + k; i.value = p[k];
      i.addEventListener("change", () => { const v = parseFloat(i.value); if (Number.isFinite(v)) { p[k] = v; changed(); } });
      l.append(s, i); u.append(l);
    }
    if (p.cell) u.append(...labelField(p.cell));
  }
  const notes = [];
  let warn = false;
  if (st.voltsDup) notes.push("The voltage is a cell on this page: the strip does not show it twice.");
  if (p.kind === "chart" && st.title) notes.push("The title is in the strip, so the chart's header has no label.");
  if (!st.shown) notes.push("No strip: no title and no voltage. The page takes all 64 rows.");
  if (p.kind === "chart" && !(p.min < p.max)) { warn = true; notes.push("The scale's start has to be below its end."); }
  for (const c of LAYOUT?.channels || []) {
    if (!c.alarm) continue;
    const target = state.pages.find(q => q.kind === "values" && q.cells.some(r => same(r, c.ref)));
    if (target === p) notes.push(`The alarm on ${labelOf(c.ref)} raises this page.`);
    else if (!target && sel === 0) { warn = true; notes.push(`The alarm on ${labelOf(c.ref)} has no values page showing it: the build refuses that.`); }
  }
  const el = $("notes"); el.textContent = notes.join(" ");
  el.className = "hint" + (warn ? " warn" : "");
}

function renderBlocks() {
  const units = [...new Map(CAT.map(c => [c.unit, c.unitName])).entries()];
  const chips = [["all", "All"], ...units.map(([u, n]) => [u, n ? `${u} · ${n}` : u])];
  const el = $("blocks"); el.textContent = "";
  for (const [id, name] of chips) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = name; b.setAttribute("aria-pressed", id === block);
    b.addEventListener("click", () => { block = id; el.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b)); renderCards(); });
    el.append(b);
  }
}
function renderCards() {
  const el = $("cards"); el.textContent = "";
  if (!CAT.length) { el.innerHTML = '<div class="more">The channel list did not load.</div>'; $("catcount").textContent = "0"; return; }
  const q = $("search").value.trim().toLowerCase(), used = new Set(onPageRefs(page()).map(r => chan(r).ref));
  const num = $("only-numeric").checked;
  const list = CAT.filter(c => (block === "all" || c.unit === block)
    && (!num || c.numeric)
    && (!q || `${c.name} ${c.label || ""} ${state.labels[c.ref] || ""} ${c.ref} ${(c.aliases || []).join(" ")} ${c.did || ""} ${c.uom || ""}`.toLowerCase().includes(q)));
  $("catcount").textContent = `${list.length} of ${CAT.length}`;
  for (const c of list.slice(0, SHOWN_CARDS)) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "card" + (used.has(c.ref) ? " used" : ""); b.draggable = true;
    b.innerHTML = `<span class="lab"></span><span class="unit"></span><span class="name"></span><span class="meta"><span class="ref"></span></span>`;
    b.querySelector(".lab").textContent = labelOf(c.ref);
    b.querySelector(".unit").textContent = c.uom || "—";
    b.querySelector(".name").textContent = c.name;
    const meta = b.querySelector(".meta");
    meta.querySelector(".ref").textContent = c.ref + (c.did ? ` · ${c.did}` : "") + (c.unitName ? ` · ${c.unitName}` : "");
    const pill = (cls, text, title) => { const s = document.createElement("span"); s.className = "pill " + cls; s.textContent = text; if (title) s.title = title; meta.append(s); };
    if (c.proven) pill("proven", "measured on a car");
    if (!c.numeric) pill("mute", "not a number", c.refused || "");
    b.addEventListener("dragstart", e => startDrag(e, { from: "cat", ref: c.ref }));
    b.addEventListener("dragend", endDrag);
    b.addEventListener("click", () => tapCard(c.ref));
    el.append(b);
  }
  if (list.length > SHOWN_CARDS) { const m = document.createElement("div"); m.className = "more"; m.textContent = `${list.length - SHOWN_CARDS} more: narrow the search or pick a unit.`; el.append(m); }
}

// ---- drag and drop. The payload is kept here; dataTransfer only carries a token so the drag starts.
let drag = null;
function startDrag(e, d) { drag = d; e.dataTransfer.setData("text/plain", d.ref || d.from); e.dataTransfer.effectAllowed = "copyMove"; document.body.classList.add("dragging"); }
function endDrag() { drag = null; document.body.classList.remove("dragging"); document.querySelectorAll(".over").forEach(x => x.classList.remove("over")); }
function dropTarget(el, onDrop, accept = ["cat"]) {
  el.addEventListener("dragover", e => { if (drag && accept.includes(drag.from)) { e.preventDefault(); el.classList.add("over"); } });
  el.addEventListener("dragleave", () => el.classList.remove("over"));
  el.addEventListener("drop", e => {
    const d = drag; endDrag();
    if (!d || !accept.includes(d.from)) return;
    e.preventDefault(); onDrop(d);
  });
}
// A cell dropped on the channel list is taken off the page.
$("cards").addEventListener("dragover", e => { if (drag?.from === "col") e.preventDefault(); });
$("cards").addEventListener("drop", e => {
  const d = drag; endDrag();
  if (d?.from === "col") { e.preventDefault(); page().cells.splice(d.i, 1); selCol = -1; changed(); }
});

function numericOr(ref) { const c = chan(ref); if (!c.numeric) { toast(`${c.name} is not a number: the dash cannot show it. ${c.refused || ""}`); return false; } return true; }
function addCell(ref) {
  const p = page();
  if (!numericOr(ref)) return;
  if (p.cells.some(r => same(r, ref))) return toast("That channel is on this page already.");
  if (p.cells.length >= MAX_CELLS) return toast(`${MAX_CELLS} cells at most. Drop a channel on a cell to replace it.`);
  p.cells.push(ref); changed();
}
function placeCell(ref, i) {
  const p = page(), j = p.cells.findIndex(r => same(r, ref));
  if (j === i || !numericOr(ref)) return;
  if (j >= 0) [p.cells[i], p.cells[j]] = [p.cells[j], p.cells[i]];
  else p.cells[i] = ref;
}
function setChart(ref) {
  if (!numericOr(ref)) return;
  const p = page();
  p.cell = ref; changed();
}
function tapCard(ref) {
  const p = page();
  if (p.kind === "chart") return setChart(ref);
  if (selCol >= 0) { placeCell(ref, selCol); return changed(); }
  addCell(ref);
}

// ---- page settings
$("title-input").addEventListener("input", e => { page().title = e.target.value.toUpperCase(); changed(true); });
$("kind-values").addEventListener("click", () => {
  const p = page(); if (p.kind === "values") return;
  p.kind = "values"; p.cells = p.cell ? [p.cell] : []; changed();
});
$("kind-chart").addEventListener("click", () => {
  const p = page(); if (p.kind === "chart") return;
  p.kind = "chart"; p.cell = p.cells[0] || "";
  changed();
});
$("volts-toggle").addEventListener("change", e => { page().volts = e.target.checked; changed(); });
$("move-left").addEventListener("click", () => { if (sel > 0) { const [p] = state.pages.splice(sel, 1); state.pages.splice(--sel, 0, p); changed(); } });
$("move-right").addEventListener("click", () => { if (sel < state.pages.length - 1) { const [p] = state.pages.splice(sel, 1); state.pages.splice(++sel, 0, p); changed(); } });
$("delete-page").addEventListener("click", () => { if (state.pages.length > 1) { state.pages.splice(sel, 1); sel = Math.max(0, sel - 1); changed(); } });
$("search").addEventListener("input", renderCards);
$("only-numeric").addEventListener("change", renderCards);

// ---- dash.toml
function q(s) { return JSON.stringify(s); }
function pageLines(p) {
  const out = [`[[page]]`, `kind = ${q(p.kind)}`];
  const t = (p.title || "").trim().toUpperCase();
  if (t) out.push(`title = ${q(t)}`);
  if (p.kind === "values") out.push(`cells = [${p.cells.map(q).join(", ")}]`);
  else out.push(`cell = ${q(p.cell || "")}`, `min = ${p.min}`, `max = ${p.max}`);
  if (LAYOUT?.strip && !p.volts) out.push(`volts = false`);
  out.push(``);
  return out;
}
function channelLines(r) {
  const c = chan(r), out = [`[[channel]]`, `ref = ${q(c.ref)}   # ${c.name}${c.uom ? ", " + c.uom : ""}`];
  if (state.labels[c.ref]) out.push(`label = ${q(state.labels[c.ref])}`);
  out.push(``);
  return out;
}
function renderToml() {
  const used = [];
  for (const p of state.pages) for (const r of onPageRefs(p)) if (!used.some(u => same(u, r))) used.push(r);
  const known = (LAYOUT?.channels || []).map(c => c.ref);
  const fileLabel = Object.fromEntries((LAYOUT?.channels || []).map(c => [chan(c.ref).ref, c.label || ""]));
  const out = [];
  if (!LAYOUT?.fromFile) {
    // No dash.toml yet: the whole file.
    out.push(`vin = ${q(LAYOUT?.vin || "")}`, ``);
    for (const r of used) out.push(...channelLines(r));
    for (const p of state.pages) out.push(...pageLines(p));
    $("export-hint").textContent = "This car has no dash.toml yet: this is the whole file. Save it as ~/.vagcan/dash/" + (LAYOUT?.vin || "<VIN>") + "/dash.toml, then run vagcan dev dash build " + (LAYOUT?.vin || "<VIN>") + ".";
  } else {
    out.push(`# Replace every [[page]] of dash.toml with these:`, ``);
    for (const p of state.pages) out.push(...pageLines(p));
    const fresh = used.filter(r => !known.some(k => same(k, r)));
    if (fresh.length) {
      out.push(`# Channels dash.toml does not have yet:`, ``);
      for (const r of fresh) out.push(...channelLines(r));
    }
    const relabelled = used.filter(r => known.some(k => same(k, r)) && state.labels[chan(r).ref] && state.labels[chan(r).ref] !== fileLabel[chan(r).ref]);
    if (relabelled.length) {
      out.push(`# A new label (in the [[channel]] with this ref):`);
      for (const r of relabelled) out.push(`#   ${chan(r).ref}: label = ${q(state.labels[chan(r).ref])}`);
      out.push(``);
    }
    $("export-hint").textContent = "A label belongs to the channel, so it is the same on every page. Then run vagcan dev dash build " + LAYOUT.vin + ": it checks every line.";
  }
  if (used.some(r => chan(r).missing)) out.push(`# Not among this car's channels — the build refuses it: ${used.filter(r => chan(r).missing).join(", ")}`);
  $("toml").textContent = out.join("\n").trimEnd();
}
$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("toml").textContent); toast("Copied."); }
  catch { const r = document.createRange(); r.selectNodeContents($("toml")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected: press Cmd-C or Ctrl-C."); }
});

let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200); }
function setStatus(text) { $("status").textContent = text; }
function changed(keepFocus) {
  if (keepFocus) { renderStrip(); paint($("panel"), bitsOf(page()), 0.8); if (document.activeElement?.id !== "label-input") renderPanel(); renderToml(); }
  else render();
}

// The pages of the car's dash.toml, the way the editor holds them.
function adopt(layout) {
  MAX_PAGES = layout.maxPages || MAX_PAGES;
  MAX_CELLS = layout.maxCells || MAX_CELLS;
  state = {
    pages: (layout.pages || []).slice(0, MAX_PAGES).map(p => ({
      title: p.title || "", kind: p.kind === "chart" ? "chart" : "values",
      cells: Array.isArray(p.cells) ? p.cells.slice(0, MAX_CELLS) : [],
      cell: p.cell || "", min: Number.isFinite(p.min) ? p.min : 0, max: Number.isFinite(p.max) ? p.max : 100,
      volts: p.volts !== false,
    })),
    labels: {}, decimals: {},
  };
  for (const c of layout.channels || []) {
    const key = chan(c.ref).ref;
    if (c.label) state.labels[key] = c.label;
    if (Number.isInteger(c.decimals)) state.decimals[key] = c.decimals;
  }
}

(async () => {
  const [cat, layout] = await Promise.all([
    fetch("channels.json").then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))).catch(e => { toast("The channel list did not load: " + e.message); return []; }),
    fetch("layout.json").then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))).catch(e => { toast("dash.toml's pages did not load: " + e.message); return null; }),
    loadWasm(),
  ]);
  CAT = cat;
  byRef = new Map();
  for (const c of CAT) { byRef.set(c.ref, c); for (const a of c.aliases || []) if (!byRef.has(a)) byRef.set(a, c); }
  LAYOUT = layout;
  if (layout) adopt(layout);
  renderBlocks();
  render();
  setStatus(layout?.vin ? `${layout.vin} · ${layout.fromFile ? "the pages of its dash.toml" : "no dash.toml yet"}` : "");
})();
</script>
</body>
</html>
