[package]
name = "vag-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# The package follows the workspace's rule — `vag-` plus its path under
# `crates/` — while the binary keeps the name people type and every document
# teaches, the way `vag-dash-cfg` builds `dashcfg`. This crate belongs to no
# family, which is why its path is one segment where every other crate's is two.
[[bin]]
name = "vagcan"
path = "src/main.rs"

# The e2e cases (`tests/e2e/`) run the vagcan a person installs, which `just e2e` builds and
# names; `cargo test` alone would hand them a test build. So the workspace's tests leave
# this one out, and `just e2e` asks for it by name.
[[test]]
name = "e2e"
path = "tests/e2e.rs"
test = false

[features]
default = ["measure"]
# The stopwatch is a third of what used to be one crate and is not diagnostics.
# On by default because leaving it out is the unusual choice, behind a flag
# because a build that does not want it should not pay for it.
measure = ["dep:vag-cli-measure"]

[dependencies]
vag-cli-core = { path = "../vag-cli-core" }
vag-cli-diag = { path = "../vag-cli-diag" }
vag-cli-measure = { path = "../vag-cli-measure", optional = true }
vag-uds-client = { path = "../../uds/vag-uds-client" }
vag-uds-transport = { path = "../../uds/vag-uds-transport" }
vag-uds-can = { path = "../../uds/vag-uds-can", features = ["slcan"] }
vag-data-labels = { path = "../../data/vag-data-labels" }
# SQLite cache over the label files: parse the VCDS install once, load it back
# in milliseconds on every later run.
vag-data-db = { path = "../../data/vag-data-db" }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "io-std",
  "io-util",
  "sync",
  "time",
] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
# Synthetic catalog fixtures for the poll-scheduler tests write to a temp dir,
# now that the proven rows they used to read live under ~/.vagcan, not the repo.
tempfile = "3"
# A test build never reads HOME's ~/.vagcan (`datadir::vagcan_dir`).
vag-cli-core = { path = "../vag-cli-core", features = ["test-root"] }
# `tests/no_real_home.rs`: a canary cache of the shape an upgrade rewrites. The version
# `vag-data-db` locks, so nothing new is fetched.
rusqlite = { version = "0.31", features = ["bundled"] }
# `tests/e2e.rs`: the e2e cases under `tests/e2e/`, literate terminal sessions run against a
# virtual car (`vag-uds-sim`) with a made-up project's rows (`vag-data-db`, `vag-data-labels`).
trycmd = "0.15"
vag-uds-sim = { path = "../../uds/vag-uds-sim" }

[target.'cfg(unix)'.dev-dependencies]
# `tests/ctrl_c.rs`: the binary run in a pseudo-terminal, as a person runs it. Already in the
# lock through tokio and crossterm, so nothing new is fetched.
libc = "0.2"
