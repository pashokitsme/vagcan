[package]
name = "vag-cli-measure"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# The acceleration stopwatch, and the only crate here that is not diagnostics.
# It stands on `core` alone — checked symbol by symbol — which is why it can be
# a crate at all, and why it can be left out of a build.

[[bin]]
name = "vagcan-measure"
path = "src/bin/vagcan-measure.rs"

[dependencies]
vag-cli-core = { path = "../vag-cli-core" }
clap = { version = "4", features = ["derive"] }
vag-uds-client = { path = "../../uds/vag-uds-client" }
vag-uds-transport = { path = "../../uds/vag-uds-transport" }
vag-uds-can = { path = "../../uds/vag-uds-can", features = ["slcan"] }
vag-data-labels = { path = "../../data/vag-data-labels" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "sync", "time"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json.workspace = true
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
vag-cli-core = { path = "../vag-cli-core", features = ["test-util"] }
# `channels`' tests declare invented rows in a cache of their own, the way
# `core::extracted`'s do, so a role's ODX id reaches a candidate through the
# same join the command uses. Tests only: the command reads the cache through `core`.
vag-data-db = { path = "../../data/vag-data-db" }
tempfile = "3"
# A paused clock, for a loop test whose deadline is minutes of real time.
tokio = { workspace = true, features = ["test-util"] }
# `link::pipe_pair`: the live feed over a bus to a scripted dash board.
vag-uds-transport = { path = "../../uds/vag-uds-transport", features = ["test-util"] }
