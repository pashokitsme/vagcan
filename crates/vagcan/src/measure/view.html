     runs this page is about, and a page that hid a run from the chart while
     still carrying its card would be arguing with itself. */
  shown.forEach(function (run) {
    var d = run.derived || {};
    var marks = run.marks || [];
    var closed = marks.filter(closedMark);
    var rows = marks.map(function (m) {
      return "<tr" + (closedMark(m) ? "" : ' class="open"') + '><td class="k mono">' +
        esc(markName(m)) + '</td><td class="v num">' +
        esc(markTime(m)) + '</td><td class="v2 num">' +
        (typeof m.avg_accel_ms2 === "number" ? esc(m.avg_accel_ms2.toFixed(2)) + " m/s²" : "—") +
        "</td></tr>";
    }).join("");

    /* Only a mark that closed carries a bracket, so only a closed one calls for
       the paragraph explaining what the bracket means. */
    var anyZero = closed.some(function (m) { return m.from_t0; });

    /* What the run was asked for comes from the config, not from the run's own
       list: the writer lists an unreached mark with no time, but older files
       left it out entirely, and a card must not go quiet about a mark just
       because the run never got near it. */
    var asked = (CFG.marks || []).map(function (p) { return p[1]; });
    if (!asked.length) asked = marks.map(function (m) { return m.to; });

    var comp = [];
    if (typeof d.distance_m === "number")
      comp.push(row("distance", d.distance_m.toFixed(1) + " m",
        "±3 % — the car's own speed signal, not the maths"));
    if (typeof d.peak_accel_ms2 === "number")
      comp.push(row("peak acceleration",
        d.peak_accel_ms2.toFixed(2) + " m/s² (" + (d.peak_accel_ms2 / 9.80665).toFixed(2) + " g)",
        [typeof d.peak_accel_t === "number" ? "at " + d.peak_accel_t.toFixed(2) + " s" : null,
         d.peak_accel_gear ? "in gear " + d.peak_accel_gear : null,
         CFG.peak_statistic ? CFG.peak_statistic : null].filter(Boolean).join(", ")));
    if (typeof d.peak_power_wheel_kw === "number")
      comp.push(row("peak power, wheel", powerFigure(d.peak_power_wheel_kw), "estimate"));
    if (typeof d.peak_power_shaft_kw === "number")
      comp.push(row("peak power, shaft", powerFigure(d.peak_power_shaft_kw),
        "estimate, engine-side inertia included"));
    /* A deficit smaller than the session's own floor is a zero with a sign on
       it. Older files carry no floor at all, and those keep the bare figure —
       absent is not the same as zero. */
    (d.shifts || []).forEach(function (s) {
      var at = (typeof s.t === "number" ? "  at " + s.t.toFixed(2) + " s" : "");
      var sigma = (typeof s.deficit_sigma_ms === "number" ? s.deficit_sigma_ms * 3.6 : null);
      if (typeof s.speed_deficit_ms !== "number") {
        comp.push(row("shift " + s.from + "→" + s.to, "—", at));
        return;
      }
      var kmh = s.speed_deficit_ms * 3.6;
      // The same two σ `derive::Shift::resolved` uses, and it has to be the
      // same: a row printed as a measured sign here and as noise in the results
      // table would be one run described two ways.
      if (sigma !== null && Math.abs(kmh) <= RESOLVED_SIGMAS * sigma) {
        comp.push(row("shift " + s.from + "→" + s.to,
          "under ±" + (RESOLVED_SIGMAS * sigma).toFixed(1) + " km/h",
          "not resolved at this session's rate" + at));
        return;
      }
      comp.push(row("shift " + s.from + "→" + s.to,
        kmh.toFixed(1) + (sigma !== null ? " ±" + sigma.toFixed(1) : "") + " km/h",
        (typeof s.cost_on_mark_s === "number" ? s.cost_on_mark_s.toFixed(2) + " s on the mark" : "") + at));
    });

    var peaks = [];
    if (typeof d.peak_rpm === "number")
      peaks.push(row("peak engine speed", Math.round(d.peak_rpm) + unitSuffix("/min"), ""));

    html += '<div class="card res"><div class="head"><span class="rn">Run ' + esc(run.index) +
      "</span>" + (run.aborted ? '<span class="badge ab">aborted</span>' : "") +
      /* Degraded is not aborted: the run went the whole way and the filter
         keeps it, its poll rate just collapsed somewhere along it. Said here
         so that "successful" does not quietly come to mean "trustworthy". */
      (run.degraded ? '<span class="badge dg">degraded</span>' : "") +
      (run.t0_wall ? '<span class="badge">' + esc(String(run.t0_wall).replace("T", " ").slice(0, 19)) +
        "</span>" : "") + "</div>";

    html += '<div class="blk"><h3>Measured</h3>';
    if (rows) {
      html += '<table class="t"><tr><th>mark (km/h)</th><th style="text-align:right">time</th>' +
        '<th style="text-align:right">average acceleration</th></tr>' + rows + "</table>";
    } else if (!asked.length) {
      html += '<p class="hint">No mark was asked for in this run.</p>';
    }

    /* A card that is short, or mostly dashes, has to say why — otherwise it
       reads as a page that failed rather than as a run that ended early. */
    if (closed.length < asked.length) {
      html += '<p class="note">' +
        (run.aborted ? "The run was aborted — the car came back to a standstill, or it was " +
          "cancelled at the keyboard, before the last mark. Whatever closed is kept. " : "") +
        (closed.length
          ? closed.length + " of " + asked.length + " marks closed; the rest have no time, " +
            "because the car never got to them."
          : "Not one of the " + asked.length + " marks closed — the car never reached even " +
            asked.reduce(function (a, b) { return Math.min(a, b); }) + " km/h, the lowest end " +
            "speed asked for. The samples were recorded all the same, so the run is still " +
            "on the chart.") +
        "</p>";
    }
    if (peaks.length) html += '<table class="t" style="margin-top:6px">' + peaks.join("") + "</table>";
    if (anyZero) {
      html += '<p class="note">A mark from a standstill carries a range because the moment the ' +
        "car started was not observed: it is already rolling before its own speed signal wakes " +
        "up, and the two ways of reaching back through that stretch disagree by the width shown. " +
        "The figure in front is the middle of that range, quotable but no better known than the " +
        "range itself — the truth is anywhere inside it, not preferentially in the centre, which " +
        "is why it is not written as a ±. A rolling mark starts from a real crossing and needs " +
        "no reaching back, so its ± is a real one: the unit's refresh period.</p>";
    }
    html += "</div>";

    if (comp.length) {
      html += '<div class="blk"><h3>Computed</h3><p class="cond">' + esc(conditionLine()) + "</p>" +
        '<table class="t">' + comp.join("") + "</table></div>";
    }
    html += "</div>";
  });
  elResults.innerHTML = html;
}

function row(k, v, v2) {
  return '<tr><td class="k">' + esc(k) + '</td><td class="v num">' + esc(v) +
    '</td><td class="v2">' + esc(v2 || "") + "</td></tr>";
}

function conditionLine() {
  var p = [];
  if (CFG.mass_kg) p.push("mass " + CFG.mass_kg + " kg");
  if (CFG.tyre) p.push("tyre " + CFG.tyre);
  if (CFG.cda) p.push("CdA " + CFG.cda + " m²" + (CFG.cda_source ? " " + CFG.cda_source : ""));
  if (CFG.crr) p.push("Crr " + CFG.crr + (CFG.crr_source ? " " + CFG.crr_source : ""));
  if (CFG.air_density_kg_m3) p.push("ρ " + CFG.air_density_kg_m3 + " kg/m³" +
    (CFG.air_density_source ? " " + CFG.air_density_source : ""));
  if (typeof CFG.grade_percent === "number") p.push("grade " + CFG.grade_percent + " %");
  if (CFG.accel_window_s) p.push("window " + CFG.accel_window_s.toFixed(2) + " s");
  if (CFG.accel_method) p.push(CFG.accel_method);
  return p.join(", ");
}

/* ===========================================================================
   14. Footer, theme — the header is written in §0, where it can still speak
       for a session that holds no runs at all.
   =========================================================================== */

(function footer() {
  var f = document.getElementById("foot");
  var p = [];
  p.push("<b>Read solid, derived dashed.</b> A read value was on the bus and its meaning is " +
    "proven; a derived one was computed here from read values. A number that was never on the " +
    "bus must not look like one that was.");
  p.push("<b>These times flatter the car.</b> Driven-wheel slip and the speedometer's own reading " +
    "both push the same way — the car looks quicker than it is — so expect a systematic gap " +
    "against a magazine figure. The launch is a separate matter and is not one-signed: it is why " +
    "a 0-based mark is printed as a range rather than a number with a bias.");
  if (CFG.refresh_estimate_s) {
    p.push("<b>Each reading is stale by an unknown amount</b>, bounded by roughly " +
      CFG.refresh_estimate_s + " s of refresh period. On a rolling mark that bias cancels in the " +
      "difference; on a 0-based one it does not.");
  }
  p.push("<b>One session per page.</b> Comparing runs across two session files is out of scope — " +
    "everything here comes from the file this page was generated from.");
  f.innerHTML = p.map(function (t) { return "<p>" + t + "</p>"; }).join("");
})();

document.getElementById("theme").addEventListener("click", function () {
  var cur = document.documentElement.getAttribute("data-theme");
  var dark = cur ? cur === "dark"
    : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
});

/* ===========================================================================
   15. Go
   =========================================================================== */

buildControls();
/* The chart first, the cards after — on the page and in the code both. The
   cards do not depend on the chart's selection, so they are drawn here and
   again only when the successful-runs filter moves, not on every control
   change; and in this order a mistake in them cannot leave the page with no
   chart, which is exactly how the last one was found. */
sync();
renderResults();

var redrawTimer = null;
window.addEventListener("resize", function () {
  if (redrawTimer) clearTimeout(redrawTimer);
  redrawTimer = setTimeout(function () { draw(); }, 80);
});

})();
</script>
</body>
</html>
