[package]
name = "vagcan"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Package and binary are one name. This crate belongs to no family — it
# consumes uds/ and data/ both — so it takes no family prefix, and the thing a
# person types is the thing cargo calls it.

[dependencies]
vag-uds-client = { path = "../uds/client" }
vag-uds-transport = { path = "../uds/transport", features = ["test-util"] }
vag-uds-can = { path = "../uds/can", features = ["slcan"] }
vag-data-labels = { path = "../data/labels" }
vag-uds-capture = { path = "../uds/capture" }
# SQLite cache over the label files: parse the VCDS install once, load it back
# in milliseconds on every later run.
vag-data-db = { path = "../data/db" }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "io-std",
  "io-util",
  "sync",
  "time",
] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Local-time conversion for aligning a capture against a VCDS log.
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
serde_json.workspace = true
toml_edit.workspace = true
ratatui = "0.29"
crossterm = "0.28"
dirs = "6"

[dev-dependencies]
# Synthetic catalog fixtures for the poll-scheduler tests write to a temp dir,
# now that the proven rows they used to read live under ~/.vagcan, not the repo.
tempfile = "3"
