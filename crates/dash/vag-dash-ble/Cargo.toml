[package]
name = "vag-dash-ble"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
# CoreBluetooth on macOS, BlueZ on Linux, WinRT on Windows, behind one API.
# On Linux this wants `libdbus-1-dev` present at build time — see .github/ci.yml.
btleplug = "0.11"
futures = "0.3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
uuid = "1"
