[package]
name = "vag-dash-cfg"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# `dashcfg` is what a person types; the package is named for what it configures.
[[bin]]
name = "dashcfg"
path = "src/main.rs"

[dependencies]
vag-dash-ble = { path = "../vag-dash-ble" }
# `report`: errors in the one shape `vagcan` prints them in, by the one renderer.
vag-cli-core = { path = "../../cli/vag-cli-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
btleplug = "0.11"
futures = "0.3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
