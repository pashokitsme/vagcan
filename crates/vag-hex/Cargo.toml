[package]
name = "vag-hex"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
# `d2xx` (default) compiles the native FTDI D2XX backend. It links NOTHING at
# build time — the vendored `libftd2xx.dylib` is loaded at runtime via `dlopen`
# (libloading), so the crate builds and unit-tests green with or without the
# native lib present. Turn the feature off to drop the libloading dependency
# entirely (e.g. a CI host that will never touch hardware).
default = ["d2xx"]
d2xx = ["dep:libloading"]

[dependencies]
vag-transport = { path = "../vag-transport" }
thiserror.workspace = true
# Async runtime: channels bridge the dedicated blocking D2XX thread to async.
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
# Runtime loader for the vendored FTDI D2XX dylib (no build-time link dep).
libloading = { version = "0.8", optional = true }
