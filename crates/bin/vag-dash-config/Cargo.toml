[package]
name = "vag-dash-config"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# `dashcfg` is what a person types; the package is named for what it configures.
[[bin]]
name = "dashcfg"
path = "src/main.rs"

[dependencies]
vag-ble = { path = "../../infra/vag-ble" }
anyhow = "1"
btleplug = "0.11"
futures = "0.3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
