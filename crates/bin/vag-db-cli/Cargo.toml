[package]
name = "vag-db-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Maintenance for the label cache: build it, look a part number up in it,
# count its rows, decode a .rod by hand. Not something a driver runs — but it
# is still a thing that is *run*, and `bin/` is where those live.
[[bin]]
name = "vag-db"
path = "src/main.rs"

[dependencies]
vag-db = { path = "../../infra/vag-db" }
vag-data = { path = "../../infra/vag-data" }
