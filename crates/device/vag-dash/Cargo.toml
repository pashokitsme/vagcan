[package]
name = "vag-dash"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
embedded-graphics = "0.8"
u8g2-fonts = { version = "0.8", features = ["embedded_graphics_textstyle"] }
eg-seven-segment = "0.2"

[dev-dependencies]
# The panel on the desktop. No SDL: this renders to PNG, so the layout is
# testable in CI on a machine with no display attached.
embedded-graphics-simulator = { version = "0.8", default-features = false }
