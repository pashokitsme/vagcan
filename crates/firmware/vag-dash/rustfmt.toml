# The firmware is written in rustfmt's defaults, not the repository's style, and
# this file exists to say so out loud.
#
# Without it the editor hook finds the root `rustfmt.toml` — hard tabs, two
# spaces, 150 columns — and reformats every firmware file it touches: 1,700
# lines of churn across other people's work, from editing one function. The
# firmware is excluded from the workspace, so `cargo fmt --all` never reaches it
# and CI never had an opinion either way.
#
# Unifying on the repository's style is a reasonable thing to want and is a
# separate, deliberate commit — not something an editor hook should do by
# surprise while somebody edits one line.
edition = "2021"
