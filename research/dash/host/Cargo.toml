# An empty `[workspace]` table, and it is load-bearing rather than tidy.
#
# This package is in the root manifest's `exclude` list. Cargo therefore walks
# *past* that manifest looking for a workspace — and inside a git worktree
# under `.worktrees/`, the next one up is the outer repository's, whose exclude
# paths do not match this deeper location. The build then fails with "current
# package believes it's in a workspace when it's not". This table stops the
# walk here, which is the fix cargo's own error message suggests.
[workspace]

[package]
name = "vag-dash-host"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bleecho"
path = "src/bin/bleecho.rs"

# One framed UDS request or subscription to the dash over BLE — the bench check
# of the board's side of `todo/dash/16`.
[[bin]]
name = "bleuds"
path = "src/bin/bleuds.rs"

# A CANable answering as a control unit on a bench pair, so the board's
# scheduler sees a unit that answers and its rates can be measured. Transmits:
# refuses without `--bench`, and stops on traffic from any other node.
[[bin]]
name = "benchecu"
path = "src/bin/benchecu.rs"

[[bin]]
name = "dashsim"
path = "src/bin/dashsim.rs"

[dependencies]
anyhow = "1"
btleplug = "0.11"
futures = "0.3"
# `signal`: `benchecu` prints its total on Ctrl-C.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "signal"] }
uuid = "1"
vag-dash-ble = { path = "../../../crates/dash/vag-dash-ble" }
# For one number: the gap under which two presses are one, so `dashsim` and
# the board disagree about nothing.
vag-dash-render = { path = "../../../crates/dash/vag-dash-render" }
# The link codec `bleuds` speaks, the same source the board links.
vag-uds-transport = { path = "../../../crates/uds/vag-uds-transport" }
# `benchecu`: the slcan backend it answers through, and the rule pairing a
# request id with its response id.
vag-uds-can = { path = "../../../crates/uds/vag-uds-can", features = ["slcan"] }
vag-uds-client = { path = "../../../crates/uds/vag-uds-client" }
thiserror = "2"
serialport = "4"
crossterm = "0.28"
