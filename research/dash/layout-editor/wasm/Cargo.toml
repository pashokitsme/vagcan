[package]
name = "dash-wasm"
version = "0.0.0"
edition = "2024"
publish = false

# Throwaway: the dash renderer in the browser, for the layout editor artifact.
[lib]
crate-type = ["cdylib"]

[dependencies]
vag-dash-render = { path = "../../../../crates/dash/vag-dash-render" }
embedded-graphics = "0.8"
u8g2-fonts = { version = "0.8", features = ["embedded_graphics_textstyle"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
