# Standalone research driver for the `TTTEXT2.ROD` anchor sweep.
#
# NOT a workspace member (own empty `[workspace]`, like
# `research/clb-crack/rod_crack/`): it is analysis tooling, it is CPU-heavy, and
# nothing shipped depends on it.
#
# It deliberately compiles the *shipped* decoder and key search rather than a
# copy of them: `src/main.rs` declares `crates/vag-data-labels/src/{tea,rod}.rs` as
# `#[path]` modules, so `rod/crack.rs` resolves beside `rod.rs` the ordinary
# way. Two of this project's `.rod` conclusions have had to be reopened because
# a research re-implementation and the shipped one disagreed; pointing at the
# real files leaves nothing to diverge.
[workspace]

[package]
name = "tttext2_sweep"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
