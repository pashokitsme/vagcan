name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The 469 MB of VCDS archives under vendor/*.zip and driver/** live in Git LFS.
# No crate reads them (test fixtures are bundled via include_bytes!/include_str!
# under crates/), so every job checks out WITHOUT LFS — no smudge, no bandwidth.
# If a future job genuinely parses a shipped archive, give that one job `lfs: true`
# on its own; do not turn it on here.
env:
  GIT_LFS_SKIP_SMUDGE: "1"
  CARGO_TERM_COLOR: always

# Every job runs one recipe of the justfile at the root, so `just check` on a laptop runs what CI
# runs. A new check goes into a recipe first; the job only calls it.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: extractions/setup-just@v2
      - name: just fmt-check
        run: just fmt-check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: system deps for btleplug (BlueZ over D-Bus)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # --all-targets is correct HERE: clippy should lint tests, benches and
      # examples too. It is only wrong for the dead-code job below.
      - uses: extractions/setup-just@v2
      - name: just clippy
        run: just clippy

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: system deps for btleplug (BlueZ over D-Bus)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: extractions/setup-just@v2
      - name: just test
        run: just test

  no-std:
    name: no-std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The board's target. Checking against it, rather than against the
          # host with `no_std` merely *declared*, is what makes the job honest:
          # on the host `std` is still linkable and a stray `std::` path can
          # slip through.
          targets: riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      # Three crates carry a default `std` feature; without it they are
      # `no_std` + `alloc` and the ESP32-C3 firmware links them. Nothing else in
      # CI sees that configuration — `cargo test`, `cargo clippy` and
      # rust-analyzer all use default features — so without this job the board
      # build rots the moment somebody writes `std::` in vag-uds-client.
      #
      # The firmware itself is linted by the `firmware` job below: it is outside
      # the workspace, with its own toolchain file and `.cargo/config.toml`.
      - uses: extractions/setup-just@v2
      - name: just no-std (vag-uds-transport, vag-uds-client, vag-uds-can)
        run: just no-std

  # The board's firmware and the bench rig that stands in for its panel. Both
  # are outside the workspace, so nothing above sees them — which is how a
  # clippy error sat in `dash.rs` unnoticed. Each is built from its own
  # directory, as the workspace's `exclude` comment says it must be.
  firmware:
    name: firmware (vag-dash-fw)
    runs-on: ubuntu-latest
    env:
      # `build.rs` builds the image's plan from one car under ~/.vagcan, which
      # CI does not have and must not have. This gives the image an empty plan
      # — no unit, no channel, nothing invented — so every binary compiles and
      # is linted exactly as shipped. An image built this way is not for flashing.
      VAGCAN_DASH_NO_CAR: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf
          # llvm-tools: `llvm-size` and `llvm-nm` for the RAM budget below.
          components: rust-src, clippy, rustfmt, llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/dash/vag-dash-fw
      # `build.rs`'s plan generator is `vag-cli-core`, a host build-dependency, and
      # `vag-cli-core` finds the board over BLE (`vag-dash-ble` → btleplug → BlueZ over
      # D-Bus), so the host half of this build needs libdbus. libudev: `serialport`.
      - name: system deps for the plan generator (btleplug, serialport)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config
      - uses: extractions/setup-just@v2
      # fmt, then clippy three ways: with BLE (the default), without it (a board whose BLE
      # does not start), and with every feature — the only lint of the `bench` tools
      # (`cantest`, `cantx`, `rxprobe`) and of `rxwatch --features ack`, the car-run build.
      - name: just fw-check
        run: just fw-check
      # The board's RAM (CLAUDE.md, "Firmware RAM"). Builds `dash` with and without BLE
      # and fails when statics (.data + .bss + .noinit) pass a ceiling or the stack the
      # linker leaves (.stack, the rest of the one data-RAM region) falls under a floor.
      # The limits, what they were measured at and why, are in ram-budget.sh alone.
      # With `CI` set it builds into the default `target`, sharing the host build-deps
      # the clippy steps built; the empty-plan image it leaves there is never flashed —
      # this job flashes nothing.
      - name: just fw-ram (dash, with and without BLE)
        run: just fw-ram

  bench-host:
    name: bench host (dashsim, bleecho, bleuds, benchecu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: research/dash/host
      # libudev-dev: `serialport`'s default `libudev` feature (USB VID/PID in
      # its port list) builds `libudev-sys`, which finds libudev via pkg-config.
      - name: system deps for btleplug (BlueZ over D-Bus) and serialport (libudev)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config
      - uses: extractions/setup-just@v2
      - name: just host-check (fmt, clippy, tests)
        run: just host-check

  dead-code:
    name: dead-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: system deps for btleplug (BlueZ over D-Bus)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # MANDATORY (CLAUDE.md): --workspace, NEVER --all-targets. --all-targets
      # recompiles the binary as a test harness where `main` is unreachable and
      # reports ~140 false positives ("fn main is never used"). --force-warn
      # sees through any #[allow(dead_code)]. The lints only WARN (exit 0), so we
      # fail the job ourselves when the check reports anything dead.
      - uses: extractions/setup-just@v2
      # The recipe fails the job itself: the lints only warn, and --force-warn also lints
      # every dependency, so only a warning pointing into crates/ counts.
      - name: just dead-code
        run: just dead-code
