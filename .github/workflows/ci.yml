name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The 469 MB of VCDS archives under vendor/*.zip and driver/** live in Git LFS.
# No crate reads them (test fixtures are bundled via include_bytes!/include_str!
# under crates/), so every job checks out WITHOUT LFS — no smudge, no bandwidth.
# If a future job genuinely parses a shipped archive, give that one job `lfs: true`
# on its own; do not turn it on here.
env:
  GIT_LFS_SKIP_SMUDGE: "1"
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: system deps for btleplug (BlueZ over D-Bus)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # --all-targets is correct HERE: clippy should lint tests, benches and
      # examples too. It is only wrong for the dead-code job below.
      - name: cargo clippy --workspace --all-targets -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: system deps for btleplug (BlueZ over D-Bus)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: cargo test --workspace
        run: cargo test --workspace

  no-std:
    name: no-std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The board's target. Checking against it, rather than against the
          # host with `no_std` merely *declared*, is what makes the job honest:
          # on the host `std` is still linkable and a stray `std::` path can
          # slip through.
          targets: riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      # Three crates carry a default `std` feature; without it they are
      # `no_std` + `alloc` and the ESP32-C3 firmware links them. Nothing else in
      # CI sees that configuration — `cargo test`, `cargo clippy` and
      # rust-analyzer all use default features — so without this job the board
      # build rots the moment somebody writes `std::` in vag-uds-client.
      #
      # The firmware itself is not built here: it is outside the workspace, with
      # its own toolchain file and `.cargo/config.toml`, and building it needs
      # the ESP bootloader crates. These checks cover the part that the rest of
      # CI can break.
      - name: cargo check --no-default-features (vag-uds-transport)
        run: cargo check -p vag-uds-transport --no-default-features --target riscv32imc-unknown-none-elf
      - name: cargo check --no-default-features (vag-uds-client)
        run: cargo check -p vag-uds-client --no-default-features --target riscv32imc-unknown-none-elf
      - name: cargo check --no-default-features (vag-uds-can)
        run: cargo check -p vag-uds-can --no-default-features --target riscv32imc-unknown-none-elf

  dead-code:
    name: dead-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: system deps for btleplug (BlueZ over D-Bus)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # MANDATORY (CLAUDE.md): --workspace, NEVER --all-targets. --all-targets
      # recompiles the binary as a test harness where `main` is unreachable and
      # reports ~140 false positives ("fn main is never used"). --force-warn
      # sees through any #[allow(dead_code)]. The lints only WARN (exit 0), so we
      # fail the job ourselves when the check reports anything dead.
      - name: cargo check --workspace with --force-warn dead_code
        run: |
          set -o pipefail
          log="$(RUSTFLAGS='--force-warn dead_code' cargo check --workspace 2>&1 | tee /dev/stderr)"
          # Only OUR crates count. --force-warn via RUSTFLAGS also lints every
          # dependency, and some (e.g. proc-macro2's cfg-gated probe fns) carry
          # genuinely-unused code — those warnings point into ~/.cargo/registry,
          # never into crates/. So a dead-code warning fails the job only when the
          # `-->` location under it is a workspace crate.
          if grep -E -A2 'never (used|read|constructed)' <<<"$log" | grep -qE '^\s*-->\s.*crates/'; then
            echo "::error::dead-code detected in a workspace crate — a symbol nobody calls. If it was written to be called, the fix is the missing call site, not deletion (see CLAUDE.md)."
            exit 1
          fi
