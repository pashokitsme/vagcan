[package]
name = "vag-can-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# The package is `vag-can-cli` so that it does not read like the `vag-can`
# library it sits on top of, but the thing a person types stays `vagcan`.
[[bin]]
name = "vagcan"
path = "src/main.rs"

[dependencies]
vag-protocol = { path = "../../infra/vag-protocol" }
vag-transport = { path = "../../infra/vag-transport", features = ["test-util"] }
vag-can = { path = "../../infra/vag-can", features = ["slcan"] }
vag-data = { path = "../../infra/vag-data" }
vag-capture = { path = "../../infra/vag-capture" }
# SQLite cache over the label files: parse the VCDS install once, load it back
# in milliseconds on every later run.
vag-db = { path = "../../infra/vag-db" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Local-time conversion for aligning a capture against a VCDS log.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json.workspace = true
toml_edit.workspace = true
ratatui = "0.29"
crossterm = "0.28"
dirs = "6"

[dev-dependencies]
# Synthetic catalog fixtures for the poll-scheduler tests write to a temp dir,
# now that the proven rows they used to read live under ~/.vagcan, not the repo.
tempfile = "3"
