[workspace]
resolver = "2"
members = [
  # bus/ — talking to a car.
  "crates/bus/vag-transport",
  "crates/bus/vag-capture",
  "crates/bus/vag-protocol",
  "crates/bus/vag-can",
  # data/ — understanding what it said, from VW's own files.
  "crates/data/vag-data",
  "crates/data/vag-db",
  # device/ — the panel device seen from outside: how it draws, how you reach it.
  "crates/device/vag-dash",
  "crates/device/vag-ble",
  # bin/ — what a person runs.
  "crates/bin/vag-cli",
  "crates/bin/vag-dash-config",
]
# The libraries are not a stack. They are four roots that depend on nothing,
# and the binaries pick the ones they need:
#
#   bus/        transport -> can, protocol, capture. Talking to a car.
#   data/       vag-data -> vag-db. Understanding VW's own files.
#   device/     vag-dash (pixels) and vag-ble (the link to the board). Neither
#               depends on anything of ours; that is why the renderer runs on
#               the board unchanged. Not `firmware/`: the renderer also draws
#               PNGs on the laptop, and vag-ble is btleplug — it is the half
#               that is NOT on the board.
#   bin/        what a person runs on a laptop.
#   firmware/   what runs on the board.
#
# The one edge between roots is `vag-protocol -> vag-data`, and it exists for a
# single module (`read.rs`, decoding a measurement against a catalog). It goes
# behind the `std` feature with `address.rs`, because the board executes a plan
# with the scaling already baked in and could not hold a catalog if it wanted
# to.
#
# `firmware/` cannot be a workspace member and this is not a preference: it is
# `no_std` for `riscv32imc-unknown-none-elf` with its own `.cargo/config.toml`
# pinning that target and `build-std`. As a member it would not compile for the
# host at all. `research/` is excluded for the older reason — probes and bench
# rigs that the product does not link.
#
# Build anything excluded **from its own directory**. `--manifest-path` alone is
# not enough for the firmware: cargo discovers `.cargo/config.toml` from the
# working directory, so building it from the repository root silently targets
# the host and fails deep inside `portable-atomic`.
exclude = [
  "crates/firmware/vag-dash",
  "research/dash/host",
  "research/dash/probes",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Settings live in ~/.vagcan as a file a person edits, so the parser has to
# preserve what they wrote — comments and all — across the tool's own writes.
toml_edit = "0.25"
# Async runtime — features selected per-crate (e.g. tokio = { workspace = true, features = [...] }).
tokio = { version = "1", default-features = false }
# Benchmarking (label-lookup perf, etc).
criterion = "0.5"
