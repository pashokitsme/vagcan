[workspace]
resolver = "2"
members = [
  # infra/ — libraries. Nothing here is run directly.
  "crates/infra/vag-transport",
  "crates/infra/vag-capture",
  "crates/infra/vag-protocol",
  "crates/infra/vag-can",
  "crates/infra/vag-data",
  "crates/infra/vag-db",
  "crates/infra/vag-panel",
  "crates/infra/vag-ble",
  # bin/ — what is run.
  "crates/bin/vag-cli",
  "crates/bin/vag-db-cli",
  "crates/bin/vag-dash-config",
]
# The libraries are one directory, but they are not one stack. Four of them
# depend on nothing at all, and the binaries pick what they need:
#
#   vag-transport -> vag-can, vag-protocol, vag-capture    talking to a car
#   vag-data      -> vag-db                                VW's own files
#   vag-panel                                              a Frame in, pixels out
#   vag-ble                                                reaching a board of ours
#
# The single edge between those roots is `vag-protocol -> vag-data`, for one
# module: `read.rs`, decoding a measurement against a catalog. It goes behind
# the `std` feature with `address.rs`, because the board executes a plan with
# the scaling already baked in and could not hold a catalog if it wanted to —
# 88 MB of SQLite against 400 KB of SRAM.
#
# The division that actually changes how code is written is not a directory at
# all: whether a crate runs on the board. vag-transport, vag-protocol (minus
# those two modules), vag-can (minus slcan.rs) and vag-panel do; the rest are
# free to use std. Each crate says which it is at the top of its lib.rs.
#
# `firmware/` cannot be a workspace member and this is not a preference: it is
# `no_std` for `riscv32imc-unknown-none-elf` with its own `.cargo/config.toml`
# pinning that target and `build-std`. As a member it would not compile for the
# host at all. `research/` is excluded for the older reason — probes and bench
# rigs that the product does not link.
#
# Build anything excluded **from its own directory**. `--manifest-path` alone is
# not enough for the firmware: cargo discovers `.cargo/config.toml` from the
# working directory, so building it from the repository root silently targets
# the host and fails deep inside `portable-atomic`.
exclude = [
  "crates/firmware/vag-dash",
  "research/dash/host",
  "research/dash/probes",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Settings live in ~/.vagcan as a file a person edits, so the parser has to
# preserve what they wrote — comments and all — across the tool's own writes.
toml_edit = "0.25"
# Async runtime — features selected per-crate (e.g. tokio = { workspace = true, features = [...] }).
tokio = { version = "1", default-features = false }
# Benchmarking (label-lookup perf, etc).
criterion = "0.5"
