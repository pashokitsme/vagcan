[workspace]
resolver = "2"
members = ["crates/vag-transport", "crates/vag-capture", "crates/vag-protocol", "crates/vag-data", "crates/vag-db", "crates/vag-can", "crates/vag-dash", "crates/vagcan"]
# Research tooling and firmware, deliberately not members.
#
# `bleecho` links `btleplug`, which needs CoreBluetooth on macOS and dbus/BlueZ
# headers on Linux; as a member it would put those on the critical path of
# `cargo build --workspace` and of CI, for a tool the product does not link.
#
# `fw` and `wifi` are `no_std` firmware for `riscv32imc-unknown-none-elf`, each
# with its own `.cargo/config.toml` pinning that target and `build-std`. As
# members they would not compile for the host at all.
#
# Build any of them **from its own directory**. `--manifest-path` alone is not
# enough for the firmware: cargo discovers `.cargo/config.toml` from the working
# directory, so building it from the repository root silently targets the host
# and fails deep inside `portable-atomic`.
exclude = ["research/dash/bleecho", "research/dash/fw", "research/dash/wifi"]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Settings live in ~/.vagcan as a file a person edits, so the parser has to
# preserve what they wrote — comments and all — across the tool's own writes.
toml_edit = "0.25"
# Async runtime — features selected per-crate (e.g. tokio = { workspace = true, features = [...] }).
tokio = { version = "1", default-features = false }
# Benchmarking (label-lookup perf, etc).
criterion = "0.5"
