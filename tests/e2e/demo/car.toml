about = "A made-up car: no part number or name here belongs to a real one."

[[unit]]
request = "7E0"
name = "engine"
part = "SIM906000A"
component = "SIM ENGINE"
odx = "EV_SimEngine"
odx_version = "001001"
vin = "SIMVIN00000000001"

[unit.did]
F189 = { text = "0001" }
0600 = "01 02"
F40D = "00"
F405 = "50"
0610 = "05"                  # adaptations: idle speed offset, service interval
0611 = "00 96"
F40C = { series = [ { at_ms = 0, value = "0F A0" }, { at_ms = 1000, value = "10 00" } ], loop_ms = 2000 }

# The unit's own stamp: what a fault's standard records are checked against.
02BD = "91 01 E2 40 00 00 69 F6 00 03"

[[unit.fault]]
code = "00 01 29"
status = 0x09
# Record 01 (priority 6, 3 times), record 02 (aging 16, 123456 km, 2026-07-27 00:00:03), and
# the engine's own record 70: 1000 /min, 12.3 V, a reserved byte.
extended = "01 06 03 02 10 01 E2 40 00 00 69 F6 00 03 70 0F A0 7B 00"

[[unit]]
request = "7E1"
name = "gearbox"
part = "SIM300000B"
component = "SIM GEARBOX"
odx = "EV_SimGear"
odx_version = "001002"

[unit.did]
0620 = "50"                  # adaptation: clutch

[[unit]]
request = "710"
name = "gateway"
part = "SIM907000C"
component = "SIM GATEWAY"
installed = ["713", "70E"]

[unit.did]
# The car's stamp: what a unit that gives none of its own is checked against.
02BD = "91 01 E2 40 00 00 69 F6 00 03"

# The brakes refuse 02BD (7F 22 31), as many units do: their code is dated by the gateway's.
[[unit]]
request = "713"
name = "brakes"
part = "SIM614000D"
component = "SIM ESC"

[[unit.fault]]
code = "04 71 20"
status = 0x08
# The standard records, then an own record 70 nothing describes.
extended = "01 04 01 02 20 01 E2 00 00 00 69 F6 00 01 70 AA BB"

[[unit]]
request = "70E"
name = "body"
silent = true
