                    - generic [ref=f44e148]:
                      - paragraph [ref=f44e149]: Hey guys, i am new to the forum, hoping someone can help me with my problem.
                      - paragraph [ref=f44e150]: I have recently bought Skoda Octavia mk3 2014 1.6tdi.
                      - paragraph [ref=f44e151]: Car had a new new steering rack fitted just before i got it. It drove fine for few days after i bought it, then i have decided to fix driver's door hinges as they were badly worn. This procedure required taking the door off and disconnecting harness. After i put door back i got airbag fault(drivers door) and power steering loss with light on the dash.
                      - paragraph [ref=f44e152]: "Airbag fault cleared fine but not power steering. DTCs are: B200ff0 internal malfunction(static/abiogenesis), B2000f1 ctrl module faulty"
                      - paragraph [ref=f44e153]: I was able to clear this codes after leaving car overnight with joined battery leads, also narrowed circle to glow plug relay 511, if you unplug it and plug it back in 1 out of 3 times power steering comes back and lights go out, faults clear. But if you turn off the engine and wait for 5min (until main relay cuts power off i guess) fault is back and red steering wheel on the dash. Sometimes cuts off after 2 seconds of Fuse box checked - wiring is ok. I bought another 511 relay but same story ,as i expected, no idea how glow plug relay is related to power steering but there you go.
                      - paragraph [ref=f44e154]: Steering angle sensor seem to work correctly(according to live data) I have disconnected door harness again and checked for bent pins or broken wires - all good.
                      - paragraph [ref=f44e155]: I would suspect the battery but voltage is there, car starts no bother and when engine is running faults are still there. Also tried to put ignition on while battery connected to charger, no luck.
                      - paragraph [ref=f44e156]: Pretty frustrated with that situation, asked few garages about it, none of them seem to have clue what can cause it.
                      - paragraph [ref=f44e157]: Will try to check wiring to the control module but first need to locate it.
                      - paragraph [ref=f44e158]: Any help appreciated!
                      - paragraph [ref=f44e159]: Thanks!
