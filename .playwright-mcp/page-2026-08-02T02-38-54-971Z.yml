            - generic [ref=e141]: Skoda Karoq
            - heading "B200FF0 interner fehler" [level=1] [ref=e145]
            - generic [ref=e146]:
              - paragraph [ref=e147]: Hallo zusammen,
              - paragraph [ref=e148]: ich brauche dringend euren Rat zu meinem gebrauchten Skoda Karoq 2.0 TSI 4x4.
              - paragraph [ref=e149]: Bei der Diagnose wurde der Fehlercode B200FF0 „Steuergerät – Interner Fehler“ im System der elektrischen Lenkungsunterstützung (44) 4.1 ausgelesen. Laut Bosch-Protokoll ist dieser Fehler mit Priorität 1 hinterlegt, der Häufigkeitszähler steht auf 1 und der Verlernzähler auf 255. Der Fehler trat laut Protokoll bei 57.946 km am 27.02.2024 zum ersten Mal auf. Mittlerweile hat das Auto ca. 76.595 km gelaufen und der Fehler ist immer noch im Speicher hinterlegt, auch wenn er dort aktuell als sporadisch geführt wird.
              - paragraph [ref=e150]: "Zur Problematik: In der ersten Woche nach dem Kauf hatte ich beim Starten mehrfach die Meldung, dass der „Travel Assist“ momentan nicht verfügbar sei. Ich musste das Auto dann neu starten, damit das System wieder funktionierte. Ich bin damit in die Werkstatt gefahren, doch dort sagte man mir lediglich, das läge an einer verschmutzten Kamera. Da ich es absolut nicht für normal halte, dass sich ein System bei einer vermeintlich verschmutzten Kamera nicht von selbst wieder reaktiviert, sondern einen kompletten Neustart des Motors erzwingt, war ich skeptisch. Ich habe den Wagen daher privat noch einmal auslesen lassen – und genau dabei bin ich auf diesen hartnäckigen, internen Steuergerätefehler gestoßen."
              - paragraph [ref=e151]: "Wichtig ist mir zu erwähnen: Die anfänglichen Probleme mit dem „Travel Assist“ treten aktuell nicht mehr auf. Das Auto fährt sich vollkommen normal, so als wäre absolut nichts. Dennoch bleibt der Fehlercode im System bestehen."
              - paragraph [ref=e152]: Interessanterweise belegt das Werkstatt-Dokument für exakt denselben Tag, den 27.02.2024 bei 55.460 km, auch massive Probleme mit der Fahrzeugelektrik. Dort ist dokumentiert, dass die Starterbatterie entladen war, der Motor nicht startete und es verschiedene Einträge im Ereignisspeicher gab, die laut technischer Information repariert wurden. Da das Steuergerät der Lenkung extrem spannungsempfindlich ist, vermute ich einen direkten Zusammenhang zwischen diesem massiven Batterieproblem und dem zeitgleich aufgetretenen Lenkungsfehler.
              - paragraph [ref=e153]: "Dazu kommt: Das Auto hat beim Kauf frischen TÜV bekommen. Dass ein sicherheitsrelevanter Fehler mit Priorität 1 in der Lenkung seit 18.000 km im Speicher liegt, lässt mich sehr an der Sorgfalt bei der Prüfung zweifeln."
              - paragraph [ref=e154]: Ich habe das Fahrzeug seit dem Kauf bereits zweimal wegen genau dieser Problematik in der Werkstatt vorgestellt. Trotz meiner Hinweise auf den internen Steuergerätefehler und die Historie hat die Werkstatt bisher keinerlei Maßnahmen ergriffen. Die Aussage, das sei alles normal, ist für mich bei einem Prio-1-Fehler in der Lenkung nicht akzeptabel.
              - paragraph [ref=e155]: Ist ein solcher interner Fehler mit Priorität 1 wirklich als normal abzutun oder wird hier versucht, die Garantieabwicklung zu vermeiden? Besteht durch diesen Fehler ein Sicherheitsrisiko und werde ich damit beim nächsten TÜV Probleme bekommen, da der Fehler ja offensichtlich schon vor der letzten Untersuchung vorhanden war?
              - paragraph [ref=e156]: Hat jemand von euch Erfahrung mit diesem speziellen Fehler B200FF0 oder weiß, ob es dazu offizielle technische Informationen von Skoda gibt, die den Zusammenhang zwischen Batterieproblemen und diesem Lenkungsfehler erklären? Über eure Einschätzungen und Tipps, wie ich gegenüber der Werkstatt argumentieren soll, wäre ich sehr dankbar
              - paragraph [ref=e157]: Vielen Dank im Voraus
