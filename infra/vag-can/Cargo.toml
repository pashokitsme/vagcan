[package]
name = "vag-can"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
vag-transport = { path = "../vag-transport" }
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "io-util"] }
# Serial port access for the slcan backend constructor only; the codec and the
# stream-generic backend build (and are tested) without it.
tokio-serial = { version = "5.4", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "io-util"] }

# The bench bring-up probe talks to a real serial port; without the feature it
# would fail to build when the crate is tested on its own.
[[example]]
name = "slcan_probe"
required-features = ["slcan"]

[features]
# Enables `SlcanBackend::open()` over a real serial port (LAWICEL USB-CAN
# adapter). Off by default so the workspace builds with no serial dependency.
slcan = ["dep:tokio-serial"]
